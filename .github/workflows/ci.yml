name: CI

on: pull_request

jobs:
  build:
    runs-on: ubuntu-latest
    container: swift:latest
    steps:
    - uses: actions/checkout@v7.0.1
    - run: swift test
    - run: swift test --traits AsyncHTTPClient
  lint:
    runs-on: ubuntu-latest
    container: swift:latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: swift format lint -r -p -s .
